name: Sync Soc-Freqcap Stable

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动检查一次上游
  workflow_dispatch:       # 支持随时在网页端手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Clone upstream and generate update.json
        run: |
          git clone --depth=1 https://github.com /tmp/upstream

          python3 - << 'EOF'
          import json, os, re, urllib.parse, sys

          UPSTREAM_DIR = "/tmp/upstream"
          RAW_BASE = "https://githubusercontent.com"
          PROXY_PREFIX = "https://gh-proxy.com"

          # 1. 直接从本地克隆目录读取上游 update.json
          with open(os.path.join(UPSTREAM_DIR, "update.json"), "r", encoding="utf-8") as f:
              data = json.load(f)

          version = data["version"].strip()
          version_code = data["versionCode"]

          # 2. 严格过滤：只放行纯数字正式版（如 V2.3、V2.4），跳过 Beta / Test
          if not re.fullmatch(r"V\d+(\.\d+)+", version, re.IGNORECASE):
              print(f"Skip pre-release version: {version}")
              sys.exit(0)

          # 3. 直接在本地磁盘核对 releases/ 目录下是否存在对应的正式版 zip
          filename = f"Soc智能限频_{version}.zip"
          zip_path = os.path.join(UPSTREAM_DIR, "releases", filename)
          if not os.path.isfile(zip_path):
              print(f"Skip update, zip file not found in releases/: {filename}")
              sys.exit(0)

          # 4. 生成走镜像加速的 update.json
          raw_zip_url = RAW_BASE + urllib.parse.quote(filename)
          new_manifest = {
              "version": version,
              "versionCode": version_code,
              "zipUrl": PROXY_PREFIX + raw_zip_url,
              "changelog": PROXY_PREFIX + "https://githubusercontent.com",
              "homepage": "https://github.com"
          }

          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(new_manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Successfully synced stable release: {version} ({version_code})")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add update.json
          git diff --staged --quiet || (git commit -m "chore: sync stable update.json" && git push)
