name: Sync Soc-Freqcap Stable

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Clone upstream and generate update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone Mess1on/Soc-Freqcap /tmp/upstream -- --depth=1

          python3 - << 'EOF'
          import json, os, re, urllib.parse, sys

          REPO = "Mess1on/Soc-Freqcap"
          UPSTREAM_DIR = "/tmp/upstream"

          with open(os.path.join(UPSTREAM_DIR, "update.json"), "r", encoding="utf-8") as f:
              data = json.load(f)

          version = data["version"].strip()
          version_code = data["versionCode"]

          if not re.fullmatch(r"V\d+(\.\d+)+", version, re.IGNORECASE):
              print(f"Skip pre-release version: {version}")
              sys.exit(0)

          filename = f"Soc智能限频_{version}.zip"
          zip_path = os.path.join(UPSTREAM_DIR, "releases", filename)
          if not os.path.isfile(zip_path):
              print(f"Skip update, zip file not found: {filename}")
              sys.exit(0)

          P = "https:" + "//"
          GH = "github" + ".com"
          RAW = "raw.githubusercontent" + ".com"
          PROXY = "gh-proxy" + ".com"

          raw_zip_url = f"{P}{RAW}/{REPO}/main/releases/{urllib.parse.quote(filename)}"
          raw_log_url = f"{P}{RAW}/{REPO}/main/CHANGELOG.md"

          new_manifest = {
              "version": version,
              "versionCode": version_code,
              "zipUrl": f"{P}{PROXY}/{raw_zip_url}",
              "changelog": f"{P}{PROXY}/{raw_log_url}",
              "homepage": f"{P}{GH}/{REPO}"
          }

          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(new_manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Successfully synced: {version} ({version_code})")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add update.json
          git diff --staged --quiet || (git commit -m "chore: sync stable update.json" && git push)
